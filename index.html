<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ruangan Sederhana — Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }
    canvas { display: block; }

    #info {
      position: fixed;
      top: 16px; left: 16px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      pointer-events: none;
      min-width: 220px;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }
    #info h3 { font-size: 15px; color: #f0c060; margin-bottom: 4px; }
    #info p  { color: #aaa; font-size: 12px; }
    #info .detail { display: none; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
    #info.active .detail { display: block; }
    #info .detail span { display: block; color: #ddd; font-size: 12px; margin-bottom: 3px; }

    #vrBtn {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 28px;
      background: #c8860a;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }
    #vrBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="info">
    <h3 id="iname">Ruangan Malam</h3>
    <p id="ihint">Arahkan mouse ke objek &amp; klik untuk info detail</p>
    <div class="detail" id="idetail"></div>
  </div>
  <button id="vrBtn" disabled>VR Tidak Tersedia</button>
  
  <canvas id="c"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
